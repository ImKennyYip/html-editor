<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Editor</title>
        <style>
            body {
                margin: 0;
                height: 100vh;
                display: flex;
            }

            #editor, #preview {
                width: 50%;
                height: 100%;
                border: 0;
            }
        </style>
    </head>

    <body>
        <div id="editor"></div>
        <iframe id="preview"></iframe>
        <!-- https://ace.c9.io/ -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.44.0/ace.js"></script>

        <script>
            const editor = ace.edit("editor");
            editor.setFontSize(18);
            editor.setTheme("ace/theme/monokai");
            editor.session.setMode("ace/mode/html");
            editor.setValue(
                `<h1>Hello!</h1>
<p>Edit the HTML on the left.</p>

<button onclick="alert('It works!')">
  Click me
</button>`,
                1,
            );

            const preview = document.getElementById("preview");
            function update() {
                preview.srcdoc = editor.getValue();
            }
            update();
            editor.session.on("change", update);
        </script>
    </body>
</html>
